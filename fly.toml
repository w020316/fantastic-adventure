# Fly.io 配置文件
# 部署时 flyctl 会自动读取此文件

app = "fantastic-adventure"
primary_region = "hkg"  # 香港节点，国内访问最快

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false  # 不自动停机，保持 7x24 在线
  auto_start_machines = true
  min_machines_running = 1    # 至少保持 1 台运行

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

# 检查健康状态
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/"
